<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMW Warranty Claim Comment Generator</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 30px; background: #f4f6f9; }

        .wrapper {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            gap: 25px;
            align-items: flex-start;
        }

        .container {
            flex: 1;
            background: white;
            padding: 25px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            min-width: 320px;
        }

        .image-container {
            flex: 1;
            position: sticky;
            top: 30px;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .bmw-card {
            background: white;
            padding: 12px;
            border-radius: 8px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            text-align: center;
        }

        .bmw-image {
            width: 100%;
            height: auto;
            border-radius: 6px;
            object-fit: cover;
            display: block;
        }

        .image-caption {
            margin-top: 8px;
            font-size: 13px;
            color: #666;
            font-weight: bold;
            letter-spacing: 0.5px;
        }

        .form-group { margin-bottom: 15px; }
        label { font-weight: bold; display: block; margin-bottom: 5px; color: #333; }
        input, textarea, select { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { background: #0066bf; color: white; border: none; padding: 10px 20px; font-size: 16px; border-radius: 4px; cursor: pointer; }
        button:hover { background: #004b8d; }
        .output-box { margin-top: 20px; background: #eef2f5; padding: 15px; border-left: 4px solid #0066bf; border-radius: 4px; }
        textarea[readonly] { background: #fff; font-size: 15px; line-height: 1.5; }
        .hint { font-size: 12px; color: #666; font-weight: normal; margin-left: 5px; }
        .recommend { color: #0066bf; font-weight: normal; }
        .warning-box { margin-top: 15px; padding: 10px 15px; border-radius: 4px; font-weight: bold; display: none; font-size: 14px; }
        .warning-danger { background-color: #fff3cd; color: #856404; border: 1px solid #ffeeba; }
        .warning-success { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .warning-missing { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }

        @media (max-width: 850px) {
            .wrapper { flex-direction: column; }
            .image-container { position: static; width: 100%; }
        }
    </style>
</head>
<body>

<div class="wrapper">
    <div class="container">
        <h2>BMW Warranty Claim Comment Generator</h2>

        <div class="form-group">
            <label>O-Tone (Customer Complaint):</label>
            <input type="text" id="oTone" placeholder="例如: The chassis has oil leak.">
        </div>

        <div class="form-group">
            <label>Q-Tone (Diagnosis & Action): <span class="hint">(故障原因與處置)</span></label>
            <textarea id="qTone" rows="3" placeholder="例如: After we check. We find both tension strut with rubber mounts has oil leak. So we replace them."></textarea>
        </div>

        <div class="form-group">
            <label>零件名稱 (Component): <span class="hint recommend">強烈建議填寫 — 填了就不會猜錯，直接用你打的</span></label>
            <input type="text" id="componentOverride" placeholder="例如: expansion valve / display / HU（多個零件用逗號分隔）">
        </div>

        <div class="form-group">
            <label>Fault Code (故障碼, 選填):</label>
            <input type="text" id="faultCode" placeholder="例如: 0317F2 或填 None">
        </div>

        <div class="form-group">
            <label>Test Module (檢測計畫, 選填):</label>
            <input type="text" id="testModule" placeholder="例如: AT6450_LG_KLMA 或填 None">
        </div>

        <div class="form-group">
            <label>Diag Code (診斷碼, 選填):</label>
            <input type="text" id="diagCode" placeholder="例如: D1236_HEAT2000_28_306 或填 None">
        </div>

        <div class="form-group">
            <label>位置 (Location, 選填): <span class="hint">例如 front right / rear left，會自動接在零件名稱前面</span></label>
            <input type="text" id="positionOverride" placeholder="例如: front right">
        </div>

        <div class="form-group">
            <label>特殊處置說明 (選填): <span class="hint recommend">處置過程不是單純 clean/replace/reprogram 時（例如：先拿同款其他車做交換測試比對）請直接手動打一句，會取代自動產生的處置句子，比較不會漏掉細節</span></label>
            <textarea id="actionOverride" rows="2" placeholder="例如: We conducted a swap test with a similar model to confirm the fault before replacing the front right output shaft."></textarea>
        </div>

        <div class="form-group">
            <label>TSARA Case No. (選填):</label>
            <input type="text" id="tsaraNo" placeholder="例如: 5164534">
        </div>

        <div class="form-group">
            <label>PuMA Measure (PuMA 服務解決方案, 選填):</label>
            <input type="text" id="pumaMeasure" placeholder="例如: 20000794435083">
        </div>

        <div class="form-group">
            <label>Closing Thanks (結尾致謝):</label>
            <select id="closingText">
                <option value="Please kindly support this case,thank you.">Please kindly support this case,thank you. (預設)</option>
                <option value="Thank you for reviewing this case.">Thank you for reviewing this case.</option>
                <option value="Thank you for your review and support.">Thank you for your review and support.</option>
                <option value="Thank you for your assistance.">Thank you for your assistance.</option>
                <option value="none">不添加結尾致謝</option>
            </select>
        </div>

        <button onclick="generateComment()">生成 Claim Comment</button>

        <div id="warningBox" class="warning-box"></div>

        <div class="output-box">
            <label>Generated Claim Comment:</label>
            <textarea id="output" rows="6" readonly></textarea>
            <button onclick="copyText()" style="margin-top: 10px; background: #28a745;">複製內文</button>
        </div>
    </div>

    <div class="image-container">
        <div class="bmw-card">
            <img class="bmw-image" src="https://images.unsplash.com/photo-1555215695-3004980ad54e?auto=format&fit=crop&w=1000&q=80" alt="BMW Vehicle">
            <div class="image-caption">SHEER DRIVING PLEASURE • BMW WARRANTY ASSISTANT</div>
        </div>
    </div>
</div>

<script>
// 常見不是零件名稱、但常被規則誤抓到的字。抓到這些字一律視為抓取失敗，
// 不要硬印出來，改成提示使用者手動填「零件名稱」欄位。
const COMPONENT_BLACKLIST = [
    'show', 'shown', 'shows', 'showed', 'showing',
    'it', 'them', 'they', 'this', 'that', 'these', 'those', 'him', 'her', 'me', 'us',
    'so', 'then', 'and', 'also', 'both', 'either', 'to', 'a', 'the', 'an',
    'do', 'does', 'did', 'done', 'was', 'is', 'are', 'were', 'be', 'been',
    'find', 'found', 'check', 'checked', 'result', 'issue', 'problem', 'failure',
    'code', 'fault', 'part', 'component', 'leak', 'leaks', 'need', 'needed',
    'not', 'again', 'still', 'now', 'after'
];

function isValidComponent(candidate) {
    if (!candidate) return false;
    let words = candidate.toLowerCase().trim().split(/\s+/);
    if (words.length === 0) return false;
    // 候選字裡只要有任一個字在黑名單中，就整段判定為不可信，避免出現像
    // "the show was replaced" 這種明顯錯誤但語法上看似通順的句子。
    if (words.some(w => COMPONENT_BLACKLIST.includes(w))) return false;
    // 太短（1-2 個字母）通常是誤抓的殘字，不是真的零件名稱。
    if (candidate.replace(/\s+/g, '').length < 3) return false;
    return true;
}

// 開頭贅字可能不只一層（例如 "both side exterior mirror..."），
// 用迴圈把 both/side/the/a/an 這些字持續往後剝，而不是只清一次。
const LEADING_FILLERS = ['both', 'side', 'sides', 'the', 'a', 'an'];
function stripLeadingFillers(str) {
    let words = str.trim().split(/\s+/);
    while (words.length > 1 && LEADING_FILLERS.includes(words[0].toLowerCase())) {
        words.shift();
    }
    return words.join(' ');
}

function checkLogicMismatch(oTone, qTone) {
    let oLower = oTone.toLowerCase();
    let qLower = qTone.toLowerCase();

    let conflicts = [
        {
            oKeys: ['start', 'engine', 'drivetrain', 'drive', 'battery', 'power', '高壓', '無法啟動', '引擎'],
            qKeys: ['wiper', 'blade', 'washer', 'window', 'mirror', '雨刷', '噴水'],
            oDesc: '無法啟動 / 電力 / 引擎故障',
            qDesc: '雨刷 / 車窗 / 後視鏡'
        },
        {
            oKeys: ['noise', 'sound', 'squeak', 'rattle', '異音', '噪音'],
            qKeys: ['display', 'cid', 'hu', 'navi', '螢幕', '多媒體主機'],
            oDesc: '異音 / 噪音問題',
            qDesc: '螢幕 / 多媒體主機'
        }
    ];

    for (let c of conflicts) {
        if (c.oKeys.some(k => oLower.includes(k)) && c.qKeys.some(k => qLower.includes(k))) {
            return `⚠️ 語意合理性提示：客戶反映為「${c.oDesc}」，但診斷處置提及「${c.qDesc}」，請確認是否填錯案件！`;
        }
    }
    return null;
}

// 回傳零件名稱字串，若抓不到可信的結果就回傳 null（呼叫端要自行處理，
// 不要在這裡硬塞一個預設字串，那正是原本會印出 "the show" 這種錯誤的原因）。
function extractComponent(qTone) {
    if (!qTone) return null;

    // 1. 常見 BMW 專有名詞與複合零件庫（清單抓到的一定視為可信，不用再過黑名單）
    let compMatch = qTone.match(/\b(tension strut[s]?\s+with\s+rubber mount[s]?|output shaft|wheel pressure sensor|rdc sensor|rdc|tpms|expansion valve|spindle drive|wiper motor|water pump|thermostat|head[- ]?up display|instrument cluster|control unit|TCB|BDC|DME|CID|HU|KAFAS|IHKA|EGS|EPS|FLE)\b/i);
    if (compMatch) return compMatch[0];

    // 2. 從 "find/found/see/saw [零件] has/had" 複合句型抓取
    let findMatch = qTone.match(/(?:find|found|see|saw|check|checked)\s+([a-zA-Z0-9\s]+?\s+with\s+[a-zA-Z0-9\s]+?)(?:\s+has|\s+have|\s+had|\s+is|\s+was|\.|$)/i);
    if (findMatch) {
        let candidate = stripLeadingFillers(findMatch[1]);
        if (isValidComponent(candidate)) return candidate;
    }

    // 3. 一般 "find/found/replace/renew/change/exchange/damaged [零件]" 句型，
    //    抓到句號、逗號、或 so/and 這種轉折詞就停止，避免把後面整段口語都吃進來
    let generalMatch = qTone.match(/(?:find|found|replace[d]?|renew(?:ed)?|change[d]?|exchange[d]?|damaged)\s+([a-zA-Z0-9\-]+(?:\s+[a-zA-Z0-9\-]+){0,3}?)(?:\s+has\b|\s+have\b|\s+had\b|\s+is\b|\s+was\b|\s+so\b|\s+and\b|[.,]|$)/i);
    if (generalMatch) {
        let candidate = stripLeadingFillers(generalMatch[1]);
        if (isValidComponent(candidate)) return candidate;
    }

    // 4. "caused by [零件] faulty/defective/broken/malfunctioning/damaged" 句型
    //    （沒有 replace/found 這類動詞觸發字時，這條專門補這種「形容詞收尾」的講法）
    let causedByMatch = qTone.match(/(?:caused by|due to)\s+(?:the\s+)?([a-zA-Z0-9\-]+(?:\s+[a-zA-Z0-9\-]+){0,5}?)\s+(?:is\s+|was\s+|were\s+|being\s+)?(?:faulty|defective|malfunctioning|malfunction(?:ed)?|broken|damaged|worn|failed)\b/i);
    if (causedByMatch) {
        let candidate = stripLeadingFillers(causedByMatch[1]);
        if (isValidComponent(candidate)) return candidate;
    }

    // 都抓不到可信的結果，回傳 null，交給呼叫端提示使用者手動填寫
    return null;
}

function generateComment() {
    let oTone = document.getElementById('oTone').value.trim();
    let qTone = document.getElementById('qTone').value.trim();
    let componentOverride = document.getElementById('componentOverride').value.trim();
    let positionOverride = document.getElementById('positionOverride').value.trim();
    let actionOverride = document.getElementById('actionOverride').value.trim();
    let faultCode = document.getElementById('faultCode').value.trim();
    let testModule = document.getElementById('testModule').value.trim();
    let diagCode = document.getElementById('diagCode').value.trim();
    let tsaraNo = document.getElementById('tsaraNo').value.trim();
    let pumaMeasure = document.getElementById('pumaMeasure').value.trim();
    let closingText = document.getElementById('closingText').value;

    let warningBox = document.getElementById('warningBox');
    let warningMsg = checkLogicMismatch(oTone, qTone);

    // 零件名稱：使用者有手動填就一定用手動填的（最可靠），
    // 沒填才走自動判斷，自動判斷失敗就明確告訴使用者，不要猜。
    let detectedComponent = componentOverride || extractComponent(qTone);
    let componentMissing = !detectedComponent;
    if (componentMissing) detectedComponent = "[請填寫零件名稱]";
    // 位置（front right / rear left...）直接接在零件名稱前面，讓句子更精準
    if (positionOverride && !componentMissing) detectedComponent = `${positionOverride} ${detectedComponent}`;

    if (componentMissing) {
        warningBox.innerText = "⚠️ 無法從 Q-Tone 自動判斷零件名稱，請在上方「零件名稱」欄位手動填寫後重新產生。";
        warningBox.className = "warning-box warning-missing";
        warningBox.style.display = "block";
    } else if (warningMsg) {
        warningBox.innerText = warningMsg;
        warningBox.className = "warning-box warning-danger";
        warningBox.style.display = "block";
    } else if (oTone !== "" && qTone !== "") {
        warningBox.innerText = "✅ 邏輯比對無明顯異常";
        warningBox.className = "warning-box warning-success";
        warningBox.style.display = "block";
    } else {
        warningBox.style.display = "none";
    }

    // 1. 處理 O-Tone
    let sentence1 = "";
    if (oTone !== "") {
        let cleanedOTone = oTone
            // 一次處理「(The) customer complain(ed/t) (about/that)」開頭，
            // 不管前面有沒有 The，都在同一條規則清乾淨，避免清一半漏字。
            .replace(/^(the\s+)?customer\s+complain(?:ed|t)\s*(about|that)?\s*/i, "")
            .replace(/has fault/i, "malfunction")
            .replace(/has oil leak/i, "oil leaks")
            .replace(/was damage displayed/i, "malfunction was displayed")
            .replace(/was damage/i, "was damaged")
            .replace(/warning lamp was lit up/i, "warning lamp came on")
            .replace(/was lit up/i, "came on");

        sentence1 = "Customer complained about " + cleanedOTone;
        if (!sentence1.endsWith(".")) sentence1 += ".";
    }

    let isPlural = qTone.toLowerCase().includes("both") || detectedComponent.toLowerCase().endsWith("s");

    // 2. 處理診斷敘述 (Sentence 2)
    let sentence2 = "";
    if (qTone.toLowerCase().includes("leak")) {
        let compText = isPlural ? `both ${detectedComponent}` : `a damaged ${detectedComponent}`;
        sentence2 = `Upon inspection, the technician confirmed that the failure was caused by oil leakage from ${compText}.`;
    } else if (qTone.toLowerCase().includes("noise")) {
        sentence2 = `Upon inspection, the technician confirmed that noises were observed during testing, traced to the ${detectedComponent}.`;
    } else if (qTone.toLowerCase().includes("caused by")) {
        let cause = qTone.replace(/^.*caused by/i, "").replace(/\.$/, "").trim();
        sentence2 = `Upon inspection, the technician confirmed that the issue was caused by ${cause}.`;
    } else {
        let compText = isPlural ? `damaged ${detectedComponent}` : `a damaged ${detectedComponent}`;
        sentence2 = `Upon inspection, the technician confirmed that the failure was caused by ${compText}.`;
    }

    let diagDetails = [];
    if (faultCode && faultCode.toLowerCase() !== "none") diagDetails.push(`fault code ${faultCode}`);
    if (testModule && testModule.toLowerCase() !== "none") diagDetails.push(`test module <${testModule}>`);
    if (diagCode && diagCode.toLowerCase() !== "none") diagDetails.push(`diag code <${diagCode}>`);

    if (diagDetails.length > 0) {
        sentence2 += ` Diagnostic procedure included checking ${diagDetails.join(", ")}.`;
    }

    // 3. 處置動作 (Sentence 3)
    let sentence3 = "";
    let refDocs = [];
    if (tsaraNo && tsaraNo.toLowerCase() !== "none") refDocs.push(`TSARA Case No. ${tsaraNo}`);
    if (pumaMeasure && pumaMeasure.toLowerCase() !== "none") refDocs.push(`PuMA Measure <${pumaMeasure}>`);

    if (actionOverride) {
        // 使用者手動描述的處置流程，直接採用，不要再用樣板句覆蓋掉細節
        let action = actionOverride.endsWith(".") ? actionOverride : actionOverride + ".";
        sentence3 = refDocs.length > 0
            ? `According to ${refDocs.join(" and ")}, ${action.charAt(0).toLowerCase() + action.slice(1)}`
            : action;
    } else {
        let actionSentence = "";
        let qLower = qTone.toLowerCase();
        let compArticle = isPlural ? "both" : "the";

        if (qLower.includes("clean")) {
            actionSentence = `${compArticle} ${detectedComponent} were cleaned`;
        } else if (qLower.includes("replace") || qLower.includes("renew") || qLower.includes("exchange") || qLower.includes("換")) {
            actionSentence = `${compArticle} ${detectedComponent} ${isPlural ? 'were' : 'was'} replaced`;
        } else if (qLower.includes("program") || qLower.includes("encode") || qLower.includes("update")) {
            actionSentence = `the control unit was reprogrammed`;
        } else if (!componentMissing) {
            // Q-Tone 沒有明確的處置動詞（例如只寫 "caused by X faulty"，
            // 沒說後續怎麼處理）——不要瞎猜是清潔還是更換，但至少把已知的
            // 零件名稱帶進句子，比完全空泛的「repair procedure」更有內容。
            // 如果實際上是換掉的，建議直接用上面「特殊處置說明」欄位補一句更準確。
            actionSentence = `the necessary repair procedure was performed on ${compArticle} ${detectedComponent}`;
        } else {
            actionSentence = `the necessary repair procedure was performed`;
        }

        if (refDocs.length > 0) {
            sentence3 = `According to ${refDocs.join(" and ")}, ${actionSentence} accordingly.`;
        } else {
            actionSentence = actionSentence.charAt(0).toUpperCase() + actionSentence.slice(1);
            sentence3 = `${actionSentence} accordingly.`;
        }
    }

    // 4. 致謝語
    let sentence4 = (closingText !== "none") ? closingText : "";

    let finalOutput = [sentence1, sentence2, sentence3, sentence4].filter(Boolean).join("\n");
    document.getElementById('output').value = finalOutput;
}

function copyText() {
    let copyText = document.getElementById("output");
    copyText.select();
    document.execCommand("copy");
    alert("已複製到剪貼簿！");
}
</script>

</body>
</html>
