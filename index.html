<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>BMW Warranty Claim Comment Generator</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 30px; background: #f4f6f9; }
        .container { max-width: 800px; background: white; padding: 25px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .form-group { margin-bottom: 15px; }
        label { font-weight: bold; display: block; margin-bottom: 5px; color: #333; }
        input, textarea, select { width: 100%; padding: 8px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 4px; }
        button { background: #0066bf; color: white; border: none; padding: 10px 20px; font-size: 16px; border-radius: 4px; cursor: pointer; }
        button:hover { background: #004b8d; }
        .output-box { margin-top: 20px; background: #eef2f5; padding: 15px; border-left: 4px solid #0066bf; border-radius: 4px; }
        textarea[readonly] { background: #fff; font-size: 15px; line-height: 1.5; }
        .hint { font-size: 12px; color: #666; font-weight: normal; margin-left: 5px; }
    </style>
</head>
<body>

<div class="container">
    <h2>BMW 保固案件 Claim Comment 自動生成器</h2>
    
    <div class="form-group">
        <label>O-Tone (Customer Complaint / 客戶反應):</label>
        <input type="text" id="oTone" placeholder="例如: Customer complained about emergency call system was damage displayed on CID.">
    </div>

    <div class="form-group">
        <label>Q-Tone / 診斷與處理過程 (Diagnosis & Action): <span class="hint">(貼上故障原因與處置，例如: We check the problem and it was caused by TCB damage.)</span></label>
        <textarea id="qTone" rows="3" placeholder="例如: We check the problem and it was caused by TCB damage. (或填寫中文維修過程)"></textarea>
    </div>

    <div class="form-group">
        <label>Fault Code (故障碼, 選填):</label>
        <input type="text" id="faultCode" placeholder="例如: S 0394">
    </div>

    <div class="form-group">
        <label>Test Module (檢測計畫, 選填):</label>
        <input type="text" id="testModule" placeholder="例如: AT8400_VERSORGUNG2">
    </div>

    <div class="form-group">
        <label>Diag Code (診斷碼, 選填):</label>
        <input type="text" id="diagCode" placeholder="例如: D6541_00000000_01_001">
    </div>

    <div class="form-group">
        <label>TSARA Case No. (選填):</label>
        <input type="text" id="tsaraNo" placeholder="例如: 5084580">
    </div>

    <div class="form-group">
        <label>PuMA Measure (PuMA 措施編號, 選填):</label>
        <input type="text" id="pumaMeasure" placeholder="例如: 65432100">
    </div>

    <div class="form-group">
        <label>結尾致謝語 (Closing Thanks):</label>
        <select id="closingText">
            <option value="Thank you for reviewing this case.">Thank you for reviewing this case. (預設)</option>
            <option value="Thank you for your review and support.">Thank you for your review and support.</option>
            <option value="Thank you for your assistance.">Thank you for your assistance.</option>
            <option value="none">不添加結尾致謝</option>
        </select>
    </div>

    <button onclick="generateComment()">生成 Claim Comment</button>

    <div class="output-box">
        <label>Generated Claim Comment (複製回覆 AG):</label>
        <textarea id="output" rows="6" readonly></textarea>
        <button onclick="copyText()" style="margin-top: 10px; background: #28a745;">複製內文</button>
    </div>
</div>

<script>
function generateComment() {
    let oTone = document.getElementById('oTone').value.trim();
    let qTone = document.getElementById('qTone').value.trim();
    let faultCode = document.getElementById('faultCode').value.trim();
    let testModule = document.getElementById('testModule').value.trim();
    let diagCode = document.getElementById('diagCode').value.trim();
    let tsaraNo = document.getElementById('tsaraNo').value.trim();
    let pumaMeasure = document.getElementById('pumaMeasure').value.trim();
    let closingText = document.getElementById('closingText').value;

    // 1. 處理 O-Tone
    let sentence1 = "";
    if (oTone !== "") {
        let cleanedOTone = oTone
            .replace(/was damage displayed/i, "malfunction was displayed")
            .replace(/was damage/i, "was damaged");
            
        if (!cleanedOTone.toLowerCase().startsWith("customer complained")) {
            sentence1 = "Customer complained that " + cleanedOTone;
        } else {
            sentence1 = cleanedOTone;
        }
        if (!sentence1.endsWith(".")) sentence1 += ".";
    }

    // 2. 處理診斷與零件名稱
    let sentence2 = "";
    let mainComponent = "component";
    
    let compMatch = qTone.match(/\b(TCB|BDC|DME|RAM|KAFAS|HU|IHKA|EGS|EPS|FLE)\b/i);
    if (compMatch) {
        mainComponent = compMatch[0].toUpperCase();
    }

    if (qTone !== "") {
        if (qTone.toLowerCase().includes("caused by")) {
            let cause = qTone.replace(/^.*caused by/i, "").replace(/\.$/, "").trim();
            sentence2 = `Upon inspection, the technician confirmed that the issue was caused by ${cause}.`;
        } else if (qTone.includes("故障") || qTone.includes("損壞")) {
            sentence2 = `Upon inspection, the technician confirmed that the issue was caused by a damaged ${mainComponent}.`;
        } else {
            sentence2 = `Upon inspection, the technician confirmed the failure and performed the diagnosis.`;
        }
    }

    // 處理故障碼、檢測計畫與 Diag Code
    let diagDetails = [];
    if (faultCode && faultCode.toLowerCase() !== "none") diagDetails.push(`fault code ${faultCode}`);
    if (testModule && testModule.toLowerCase() !== "none") diagDetails.push(`test module <${testModule}>`);
    if (diagCode && diagCode.toLowerCase() !== "none") diagDetails.push(`diag code <${diagCode}>`);

    if (diagDetails.length > 0) {
        sentence2 += ` Diagnostic procedure included checking ${diagDetails.join(", ")}.`;
    }

    // 3. 處理 TSARA Case 與 PuMA Measure
    let sentence3 = "";
    let refDocs = [];
    
    if (tsaraNo && tsaraNo.toLowerCase() !== "none") {
        refDocs.push(`TSARA Case No. ${tsaraNo}`);
    }
    if (pumaMeasure && pumaMeasure.toLowerCase() !== "none") {
        refDocs.push(`PuMA Measure <${pumaMeasure}>`);
    }

    if (refDocs.length > 0) {
        sentence3 = `According to ${refDocs.join(" and ")}, the ${mainComponent} was replaced accordingly.`;
    } else {
        sentence3 = `The ${mainComponent} was replaced accordingly.`;
    }

    // 4. 結尾致謝語
    let sentence4 = "";
    if (closingText !== "none") {
        sentence4 = closingText;
    }

    // 組合結果
    let finalOutput = [sentence1, sentence2, sentence3, sentence4].filter(Boolean).join("\n");
    document.getElementById('output').value = finalOutput;
}

function copyText() {
    let copyText = document.getElementById("output");
    copyText.select();
    document.execCommand("copy");
    alert("已複製到剪貼簿！");
}
</script>

</body>
</html>
